config_version: 1
projects:
  - project_id: person-relation-lab
    display_name: Person Relation Lab
    technologies: [python, postgresql, docker]
    sources:
      - source_id: database-container
        kind: docker
        selector:
          compose_project: person-relation-lab
          compose_service: db
        include_logs: true
        log_tail_on_attach: 100
        log_max_lines_per_cycle: 500
        heartbeat_seconds: 300
        memory_warning_bytes: 26843545600
      - source_id: application-container
        kind: docker
        selector:
          compose_project: person-relation-lab
          compose_service: app
        include_logs: true
        log_tail_on_attach: 100
        log_max_lines_per_cycle: 500
        heartbeat_seconds: 300
      - source_id: importer-process
        kind: process
        pid_file_ref: local://person-relation-lab/importer.pid
        heartbeat_seconds: 300
        cpu_warning_percent: 90
        rss_warning_bytes: 8589934592
        include_children: true

  - project_id: community-selection-miniapp
    display_name: Community Selection Miniapp
    technologies: [typescript, nodejs, postgresql, docker]
    sources:
      - source_id: api-container
        kind: docker
        selector:
          compose_project: community-selection-miniapp
          compose_service: api
        include_logs: true
        log_tail_on_attach: 100
        log_max_lines_per_cycle: 500
        heartbeat_seconds: 300
      - source_id: admin-container
        kind: docker
        selector:
          compose_project: community-selection-miniapp
          compose_service: admin
        include_logs: true
        log_tail_on_attach: 100
        log_max_lines_per_cycle: 500
        heartbeat_seconds: 300

  - project_id: chan-shuo
    display_name: Chan Shuo
    technologies: [typescript, nodejs]
    sources:
      - source_id: local-runner-process
        kind: process
        pid_file_ref: local://chan-shuo/local-runner.pid
        heartbeat_seconds: 300
        cpu_warning_percent: 90
        rss_warning_bytes: 4294967296
        include_children: true
