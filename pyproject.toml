[project]
name = "project-agent-controller"
version = "0.1.0a1"
description = "Local-first multi-project observer and incident memory controller"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<0.130",
  "httpx>=0.28,<0.29",
  "psutil>=7.0,<8",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0.2,<7",
  "typer>=0.16,<0.27",
  "uvicorn>=0.35,<0.49",
  "watchfiles>=1.1,<2",
]

[project.scripts]
pac = "project_agent_controller.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<0.16",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_agent_controller"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["project_agent_controller"]
