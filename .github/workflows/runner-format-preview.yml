name: PAC Runner format preview (temporary)

on:
  pull_request:
    paths:
      - "experiments/codex-loop/runner/**"
      - ".github/workflows/runner-format-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Generate formatting proposal without committing or pushing
        run: |
          uv run --group dev ruff check --fix experiments/codex-loop/runner || true
          uv run --group dev ruff format experiments/codex-loop/runner
          python3 - <<'PY'
          import base64
          from pathlib import Path

          root = Path("experiments/codex-loop/runner")
          for path in sorted(root.rglob("*.py")):
              relative = path.as_posix()
              payload = base64.b64encode(path.read_bytes()).decode("ascii")
              print("PAC_BEGIN_FORMAT:" + relative, flush=True)
              for index in range(0, len(payload), 1200):
                  print("PAC_DATA:" + payload[index:index+1200], flush=True)
              print("PAC_END_FORMAT:" + relative, flush=True)
          PY
